<svg xmlns="http://www.w3.org/2000/svg" width="440" height="410" viewBox="0 0 440 410" role="img" aria-labelledby="title"><title id="title">Priyanshu Chaurasia — engineer, founder, always building. Welcome to Priyanshu OS.</title><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#a8b2c1"/></pattern><radialGradient id="halo"><stop stop-color="#27466f" stop-opacity=".38"/><stop offset="1" stop-color="#101318" stop-opacity="0"/></radialGradient></defs>
  <style>
    .orbit{transform-origin:370px 102px;animation:orbit 48s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:blink 1.1s steps(2,end) infinite}.type-line{animation:type 3s steps(24,end) both}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.orbit,.pulse,.cursor,.type-line{animation:none}}
  </style>
  <rect x="1" y="1" width="438" height="408" rx="22" fill="#101318" stroke="#303a49"/>
  <rect x="1" y="1" width="438" height="408" rx="22" fill="url(#dots)" opacity=".32"/>
  <circle cx="410" cy="170" r="260" fill="url(#halo)"/>
  <g class="orbit" fill="none" stroke="#a0c5ff" stroke-opacity=".16">
    <ellipse cx="370" cy="102" rx="102" ry="48" transform="rotate(-35 370 102)"/>
    <circle cx="448" cy="55" r="4" fill="#a0c5ff"/>
  </g>
  <circle cx="31" cy="39" r="4" fill="#a0c5ff" class="pulse"/>
  <text x="46" y="44" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#a8b2c1" letter-spacing="2">PRIYANSHU OS / PERSONAL EDITION</text>
  <line x1="26" y1="65" x2="414" y2="65" stroke="#303a49"/>
  <text x="26" y="132" font-family="'Segoe UI',Arial,sans-serif" font-size="44" fill="#f3f2ed" font-weight="750" letter-spacing="-2.5">Priyanshu</text>
  <text x="26" y="184" font-family="'Segoe UI',Arial,sans-serif" font-size="44" fill="#f3f2ed" font-weight="750" letter-spacing="-2.5">Chaurasia.</text>
  <text x="26" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#a0c5ff" font-weight="500">Engineer. Founder. Always building.</text>
  <g class="type-line"><text x="26" y="265"  font-size="16" fill="#eac69f" font-family="monospace">&gt; I build the systems</text>
  <text x="26" y="289"  font-size="16" fill="#eac69f" font-family="monospace">  institutions run on.</text></g>
  <rect x="226" y="276" width="7" height="17" fill="#eac69f" class="cursor"/>

  <line x1="26" y1="357" x2="414" y2="357" stroke="#303a49"/>
  <text x="26" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#a8b2c1" letter-spacing="1.6">GORAKHPUR, INDIA</text>
  <text x="414" y="384" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#a8b2c1" text-anchor="end" letter-spacing="1.2">CSE ’28 · MMMUT</text>
  </svg>
