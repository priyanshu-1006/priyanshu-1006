<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="398" viewBox="0 0 1100 398" role="img" aria-labelledby="title"><title id="title">Priyanshu Chaurasia — engineer, founder, always building. Welcome to Priyanshu OS.</title><defs><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#a8b2c1"/></pattern><radialGradient id="halo"><stop stop-color="#27466f" stop-opacity=".38"/><stop offset="1" stop-color="#101318" stop-opacity="0"/></radialGradient></defs>
  <style>
    .orbit{transform-origin:900px 150px;animation:orbit 48s linear infinite}
    .pulse{animation:pulse 3s ease-in-out infinite}.cursor{animation:blink 1.1s steps(2,end) infinite}.type-line{animation:type 3s steps(24,end) both}
    @keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes orbit{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}
    @media(prefers-reduced-motion:reduce){.orbit,.pulse,.cursor,.type-line{animation:none}}
  </style>
  <rect x="1" y="1" width="1098" height="396" rx="22" fill="#101318" stroke="#303a49"/>
